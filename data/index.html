<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperOS</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><b>PaperOS</b><small>0.1.0-alpha · M5Paper ESP32</small></div><button id="logout">Logout</button></header>
<div id="auth" class="overlay"><section class="modal"><h1>PaperOS</h1><div id="setupBox" hidden><p>First boot setup</p><input id="deviceName" value="PaperOS" placeholder="Device name"><select id="language"><option value="it">Italiano</option><option value="en">English</option></select><input id="timezone" value="Europe/Rome" placeholder="Timezone"><input id="ssid" placeholder="Wi-Fi SSID"><input id="wifiPassword" type="password" placeholder="Wi-Fi password"><input id="adminPassword" type="password" placeholder="Admin password (min 6)"><button onclick="finishSetup()">Finish setup</button></div><div id="loginBox" hidden><input id="loginPassword" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><p id="authMsg"></p></section></div>
<nav id="nav"></nav><main id="view"></main>
<script src="/app.js"></script></body></html>
